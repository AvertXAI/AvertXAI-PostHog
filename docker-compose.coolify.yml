# =============================================================================
# docker-compose.coolify.yml — Coolify-deployable PostHog (behind existing Traefik)
# =============================================================================
#
# Phase 0/1 deploy prep for e.avertxai.com. DERIVED FROM docker-compose.hobby.yml
# (+ docker-compose.base.yml) but fully self-contained: there is NO `extends:`,
# so every value is visible in this one file. The original hobby/base files are
# left untouched.
#
# WHAT CHANGED vs. the hobby stack (see DEPLOY.md for the full rationale):
#   * Removed the bundled Caddy reverse proxy (`proxy` service) entirely.
#   * Removed ALL host port publishes (80/443 and every other `ports:` mapping).
#     Ingress is handled by Coolify's Traefik; inter-service traffic uses the
#     internal compose network + service DNS, so no host ports are needed.
#   * Traefik labels replicate the Caddy path routing (events/replay/flags/
#     surveys/livestream/object-storage/catch-all). A single web router is NOT
#     enough — capture, replay and flags are served by dedicated services.
#   * Secrets / tunables are now ${VAR} references (see .env.coolify.example).
#   * Infra images are pinned to the exact versions from docker-compose.base.yml.
#     PostHog's own app/node/rust images have no upstream semver tag — they only
#     ship moving tags (:latest / :master) — so they are parameterised
#     (POSTHOG_IMAGE_TAG / POSTHOG_NODE_TAG / POSTHOG_RUST_TAG). PIN THESE TO A
#     COMMIT SHA BEFORE PRODUCTION.
#   * `build:` contexts dropped — we pull prebuilt images (matches how
#     bin/deploy-hobby runs: `up -d --no-build --pull always`).
#   * Data volumes are named; config files remain repo-relative bind mounts
#     (they live in this repo, so deploy from git — not by pasting this file).
#
# REQUIRES (see DEPLOY.md):
#   - Deploy as a Coolify "Docker Compose" resource backed by THIS git repo
#     (the bind mounts below read ./docker, ./posthog, ./compose, ./share).
#   - ./share/GeoLite2-City.mmdb present (gitignored — supply it out of band).
#   - The web container must share Coolify's Traefik network (Coolify wires this
#     automatically when it sees traefik.enable=true).
# =============================================================================

x-logging: &default-logging
    driver: json-file
    options:
        max-size: '50m'
        max-file: '3'

# Shared environment for the Django app containers (web, worker, temporal worker,
# async-migrations check). Mirrors the merged base `worker`/`worker_env` anchors
# plus the hobby overrides, with secrets/DB pulled from env vars.
x-django-env: &django-env
    # --- base worker_env ---
    OTEL_SDK_DISABLED: 'true'
    API_QUERIES_PER_TEAM: '{"1": 100}'
    KAFKA_HOSTS: 'kafka:9092'
    DEPLOYMENT: 'hobby'
    CDP_API_URL: 'http://plugins:6738'
    FLAGS_REDIS_ENABLED: 'false'
    # --- site / secrets ---
    SITE_URL: '${SITE_URL:-https://e.avertxai.com}'
    SECRET_KEY: '${POSTHOG_SECRET_KEY:?POSTHOG_SECRET_KEY is required}'
    ENCRYPTION_SALT_KEYS: '${POSTHOG_ENCRYPTION_SALT_KEYS:?POSTHOG_ENCRYPTION_SALT_KEYS is required}'
    # --- behind Traefik (Traefik terminates TLS) ---
    IS_BEHIND_PROXY: '1'
    DISABLE_SECURE_SSL_REDIRECT: '1'
    # --- postgres (overrides the posthog:posthog defaults baked into .env.services) ---
    DATABASE_URL: 'postgres://${POSTGRES_USER:-posthog}:${POSTGRES_PASSWORD:-posthog}@db:5432/${POSTGRES_DB:-posthog}'
    PGHOST: 'db'
    PGUSER: '${POSTGRES_USER:-posthog}'
    PGPASSWORD: '${POSTGRES_PASSWORD:-posthog}'
    PGDATABASE: '${POSTGRES_DB:-posthog}'
    # --- object storage (MinIO root creds; app + MinIO must agree) ---
    OBJECT_STORAGE_ENABLED: 'true'
    OBJECT_STORAGE_ENDPOINT: 'http://objectstorage:19000'
    OBJECT_STORAGE_PUBLIC_ENDPOINT: '${SITE_URL:-https://e.avertxai.com}'
    OBJECT_STORAGE_ACCESS_KEY_ID: '${OBJECT_STORAGE_ACCESS_KEY_ID:-object_storage_root_user}'
    OBJECT_STORAGE_SECRET_ACCESS_KEY: '${OBJECT_STORAGE_SECRET_ACCESS_KEY:-object_storage_root_password}'
    # --- session replay v2 (SeaweedFS S3; runs unauthenticated locally) ---
    SESSION_RECORDING_V2_S3_ENDPOINT: 'http://seaweedfs:8333'
    SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: '${SESSION_RECORDING_S3_ACCESS_KEY_ID:-any}'
    SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: '${SESSION_RECORDING_S3_SECRET_ACCESS_KEY:-any}'
    RECORDING_API_URL: 'http://recording-api:6738'

services:
    # -------------------------------------------------------------------------
    # Datastores
    # -------------------------------------------------------------------------
    db:
        image: postgres:15.12-alpine
        restart: on-failure
        logging: *default-logging
        environment:
            POSTGRES_USER: '${POSTGRES_USER:-posthog}'
            POSTGRES_DB: '${POSTGRES_DB:-posthog}'
            POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-posthog}'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-posthog}']
            interval: 5s
            timeout: 30s
            retries: 30
            start_period: 10s
        volumes:
            # First-boot init scripts create the cyclotron / persons / behavioral_cohorts
            # / flags_read_store / per-product databases (they honour $POSTGRES_USER).
            - ./docker/postgres-init-scripts:/docker-entrypoint-initdb.d
            - ./products:/products:ro
            - postgres-data:/var/lib/postgresql/data

    redis7:
        image: redis:7.2-alpine
        restart: on-failure
        logging: *default-logging
        command: redis-server --maxmemory-policy allkeys-lru --maxmemory 200mb
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 3s
            timeout: 10s
            retries: 10
        volumes:
            - redis7-data:/data

    clickhouse:
        # Keep the version in sync with docker-compose.base.yml.
        image: clickhouse/clickhouse-server:26.3.10.60
        restart: on-failure
        logging: *default-logging
        environment:
            CLICKHOUSE_SKIP_USER_SETUP: 1
            KAFKA_HOSTS: 'kafka:9092'
        healthcheck:
            # nosemgrep: trailofbits.generic.wget-unencrypted-url.wget-unencrypted-url
            test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1']
            interval: 3s
            timeout: 10s
            retries: 10
        depends_on:
            - kafka
            - zookeeper
        volumes:
            - ./posthog/idl:/idl
            - ./docker/clickhouse/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
            - ./docker/clickhouse/config.xml:/etc/clickhouse-server/config.xml
            - ./docker/clickhouse/config.d/default.xml:/etc/clickhouse-server/config.d/default.xml
            - ./docker/clickhouse/users.xml:/etc/clickhouse-server/users.xml
            - ./docker/clickhouse/user_defined_function.xml:/etc/clickhouse-server/user_defined_function.xml
            - ./posthog/user_scripts:/var/lib/clickhouse/user_scripts
            - clickhouse-data:/var/lib/clickhouse

    zookeeper:
        # Vestigial under Redpanda (Raft-based) but kept: clickhouse/kafka still
        # declare a depends_on for it. Harmless.
        image: zookeeper:3.7.0
        restart: on-failure
        logging: *default-logging
        environment:
            ZOO_AUTOPURGE_PURGEINTERVAL: 1
            ZOO_AUTOPURGE_SNAPRETAINCOUNT: 3
        volumes:
            - zookeeper-datalog:/datalog
            - zookeeper-data:/data
            - zookeeper-logs:/logs

    kafka:
        image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
        restart: on-failure
        logging: *default-logging
        command:
            - redpanda
            - start
            - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
            - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
            - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
            - --advertise-pandaproxy-addr internal://kafka:8082,external://localhost:18082
            - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
            - --rpc-addr kafka:33145
            - --advertise-rpc-addr kafka:33145
            - --mode dev-container
            - --smp 2
            - --memory 3G
            - --reserve-memory 500M
            - --overprovisioned
            - --set redpanda.empty_seed_starts_cluster=false
            - --seeds kafka:33145
            - --set redpanda.auto_create_topics_enabled=true
        environment:
            ALLOW_PLAINTEXT_LISTENER: 'true'
            KAFKA_LOG_RETENTION_MS: 3600000
            KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
            KAFKA_LOG_RETENTION_HOURS: 1
        healthcheck:
            test: curl -f http://localhost:9644/v1/status/ready || exit 1
            interval: 3s
            timeout: 10s
            retries: 10
        depends_on:
            - zookeeper
        volumes:
            - redpanda-data:/var/lib/redpanda/data

    kafka-init:
        image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
        entrypoint: /bin/sh
        logging: *default-logging
        command:
            - -c
            - |
                set -x
                echo "Waiting for Kafka broker to accept connections..."
                TIMEOUT=60
                ELAPSED=0
                until rpk topic list --brokers kafka:9092 2>/dev/null; do
                    echo "Kafka broker not ready yet (elapsed: $${ELAPSED}s)..."
                    sleep 2
                    ELAPSED=$$((ELAPSED + 2))
                    if [ $$ELAPSED -ge $$TIMEOUT ]; then
                        echo "Timeout waiting for Kafka broker after $${TIMEOUT}s"
                        rpk topic list --brokers kafka:9092 || true
                        exit 1
                    fi
                done
                echo "Kafka broker is accepting requests, creating topics..."
                TOPICS="clickhouse_events_json \
                    clickhouse_ai_events_json \
                    clickhouse_heatmap_events \
                    clickhouse_ingestion_warnings \
                    events_plugin_ingestion_dlq \
                    events_plugin_ingestion_overflow \
                    events_plugin_ingestion_async \
                    clickhouse_groups \
                    clickhouse_person \
                    clickhouse_person_distinct_id \
                    clickhouse_app_metrics2 \
                    log_entries \
                    clickhouse_tophog"
                for topic in $$TOPICS; do
                    if rpk topic create "$$topic" --brokers kafka:9092 -p 1 -r 1 2>&1; then
                        echo "Topic $$topic created successfully"
                    else
                        if rpk topic list --brokers kafka:9092 | grep -q "$$topic"; then
                            echo "Topic $$topic already exists, continuing"
                        else
                            echo "Failed to create topic $$topic"
                            exit 1
                        fi
                    fi
                done
                echo "Final topic list:"
                rpk topic list --brokers kafka:9092
                echo "Topics ready"
        depends_on:
            kafka:
                condition: service_healthy

    # -------------------------------------------------------------------------
    # Object storage
    # -------------------------------------------------------------------------
    objectstorage:
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        restart: on-failure
        logging: *default-logging
        environment:
            MINIO_ROOT_USER: '${OBJECT_STORAGE_ACCESS_KEY_ID:-object_storage_root_user}'
            MINIO_ROOT_PASSWORD: '${OBJECT_STORAGE_SECRET_ACCESS_KEY:-object_storage_root_password}'
        entrypoint: sh
        # create the posthog / ducklake-dev / ai-blobs buckets before starting
        command: -c 'mkdir -p /data/posthog /data/ducklake-dev /data/ai-blobs && minio server --address ":19000" --console-address ":19001" /data'
        volumes:
            - objectstorage:/data

    seaweedfs:
        image: chrislusf/seaweedfs:4.03
        restart: on-failure
        logging: *default-logging
        entrypoint:
            - /bin/sh
            - -c
            - |
                /usr/bin/weed "$$@" &
                WEED_PID=$$!
                echo "Waiting for SeaweedFS to initialize..."
                while true; do
                    sleep 5
                    echo "Checking if posthog bucket exists..."
                    if echo "s3.bucket.list" | /usr/bin/weed shell -master=localhost:9333 2>&1 | grep -q "posthog"; then
                        echo "Bucket posthog exists!"
                        break
                    fi
                    echo "Bucket not found, attempting to create..."
                    echo "s3.bucket.create -name posthog" | /usr/bin/weed shell -master=localhost:9333 2>&1 || true
                    echo "Retrying in 5s..."
                done
                echo "SeaweedFS ready with posthog bucket"
                wait $$WEED_PID
            - --
        command: ['server', '-s3', '-s3.port=8333', '-dir=/data']
        healthcheck:
            test:
                [
                    'CMD',
                    'sh',
                    '-c',
                    "echo 's3.bucket.list' | /usr/bin/weed shell -master=localhost:9333 2>&1 | grep -q posthog",
                ]
            interval: 5s
            timeout: 10s
            retries: 30
            start_period: 10s
        volumes:
            - seaweedfs:/data

    # -------------------------------------------------------------------------
    # PostHog application (Django) — image: posthog/posthog
    # -------------------------------------------------------------------------
    web:
        image: ${POSTHOG_REGISTRY:-posthog/posthog}:${POSTHOG_IMAGE_TAG:-latest}
        command: /compose/start
        restart: on-failure
        logging: *default-logging
        # .env.services supplies the service-connection defaults (REDIS_URL,
        # CLICKHOUSE_HOST/DATABASE, OBJECT_STORAGE_FORCE_PATH_STYLE, the
        # CLICKHOUSE_*_USER/PASSWORD pairs from users.xml, ...); the environment
        # block below overrides the secrets and DB creds on top of it.
        env_file: .env.services
        environment:
            <<: *django-env
            LIVESTREAM_HOST: '${SITE_URL:-https://e.avertxai.com}/livestream'
            OTEL_SERVICE_NAME: 'posthog'
            OTEL_EXPORTER_OTLP_ENDPOINT: ''
            OPT_OUT_CAPTURE: '${OPT_OUT_CAPTURE:-false}'
            PERSONHOG_ADDR: 'personhog-router:50052'
            PERSONHOG_ENABLED: 'true'
            PERSONHOG_ROLLOUT_PERCENTAGE: '100'
        volumes:
            - ./compose:/compose
        healthcheck:
            # Added for Coolify/Traefik readiness (the prod image ships python3).
            # Remove if it ever flaps — Traefik can rely on its own health logic.
            test:
                [
                    'CMD-SHELL',
                    'python3 -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://localhost:8000/_health'').status==200 else 1)" || exit 1',
                ]
            interval: 15s
            timeout: 10s
            retries: 20
            start_period: 300s
        depends_on:
            - db
            - redis7
            - clickhouse
            - kafka
            - objectstorage
            - seaweedfs
            - personhog-router
        labels:
            # ---- catch-all: everything not matched by a more specific router below ----
            - 'traefik.enable=true'
            - 'traefik.http.routers.posthog.rule=Host(`${DOMAIN:-e.avertxai.com}`)'
            - 'traefik.http.routers.posthog.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}'
            - 'traefik.http.routers.posthog.tls=true'
            - 'traefik.http.routers.posthog.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}'
            - 'traefik.http.routers.posthog.priority=1'
            - 'traefik.http.services.posthog.loadbalancer.server.port=8000'

    worker:
        image: ${POSTHOG_REGISTRY:-posthog/posthog}:${POSTHOG_IMAGE_TAG:-latest}
        command: ./bin/docker-worker-celery --with-scheduler
        restart: on-failure
        logging: *default-logging
        env_file: .env.services
        environment:
            <<: *django-env
            POSTHOG_SKIP_MIGRATION_CHECKS: '1'
            PERSONHOG_ADDR: 'personhog-router:50052'
            PERSONHOG_ENABLED: 'true'
            PERSONHOG_ROLLOUT_PERCENTAGE: '100'
        depends_on:
            db:
                condition: service_healthy
            redis7:
                condition: service_healthy
            clickhouse:
                condition: service_started
            kafka:
                condition: service_healthy
            web:
                condition: service_started
            personhog-router:
                condition: service_started

    asyncmigrationscheck:
        image: ${POSTHOG_REGISTRY:-posthog/posthog}:${POSTHOG_IMAGE_TAG:-latest}
        command: python manage.py run_async_migrations --check
        restart: 'no'
        logging: *default-logging
        env_file: .env.services
        environment:
            <<: *django-env
            SKIP_ASYNC_MIGRATIONS_SETUP: 0

    temporal-django-worker:
        image: ${POSTHOG_REGISTRY:-posthog/posthog}:${POSTHOG_IMAGE_TAG:-latest}
        command: /compose/temporal-django-worker
        restart: on-failure
        logging: *default-logging
        env_file: .env.services
        environment:
            <<: *django-env
            TEMPORAL_HOST: temporal
        volumes:
            - ./compose:/compose
        depends_on:
            - db
            - redis7
            - clickhouse
            - kafka
            - objectstorage
            - seaweedfs
            - temporal

    # -------------------------------------------------------------------------
    # Plugin server / ingestion (node) — image: posthog/posthog-node
    # -------------------------------------------------------------------------
    plugins:
        image: ${POSTHOG_REGISTRY:-posthog/posthog}-node:${POSTHOG_NODE_TAG:-latest}
        command: node nodejs/dist/index.js
        restart: on-failure
        logging: *default-logging
        environment:
            DATABASE_URL: 'postgres://${POSTGRES_USER:-posthog}:${POSTGRES_PASSWORD:-posthog}@db:5432/${POSTGRES_DB:-posthog}'
            PERSONS_DATABASE_URL: 'postgres://${POSTGRES_USER:-posthog}:${POSTGRES_PASSWORD:-posthog}@db:5432/${POSTGRES_DB:-posthog}'
            BEHAVIORAL_COHORTS_DATABASE_URL: 'postgres://${POSTGRES_USER:-posthog}:${POSTGRES_PASSWORD:-posthog}@db:5432/${POSTGRES_DB:-posthog}'
            CYCLOTRON_DATABASE_URL: 'postgres://${POSTGRES_USER:-posthog}:${POSTGRES_PASSWORD:-posthog}@db:5432/${POSTGRES_DB:-posthog}'
            KAFKA_HOSTS: 'kafka:9092'
            REDIS_URL: 'redis://redis7:6379/'
            CDP_REDIS_HOST: redis7
            CDP_REDIS_PORT: 6379
            CLICKHOUSE_HOST: 'clickhouse'
            CLICKHOUSE_DATABASE: 'posthog'
            CLICKHOUSE_SECURE: 'false'
            CLICKHOUSE_VERIFY: 'false'
            SITE_URL: '${SITE_URL:-https://e.avertxai.com}'
            SECRET_KEY: '${POSTHOG_SECRET_KEY:?POSTHOG_SECRET_KEY is required}'
            ENCRYPTION_SALT_KEYS: '${POSTHOG_ENCRYPTION_SALT_KEYS:?POSTHOG_ENCRYPTION_SALT_KEYS is required}'
            OBJECT_STORAGE_ENABLED: 'true'
            OBJECT_STORAGE_ENDPOINT: 'http://objectstorage:19000'
            OBJECT_STORAGE_PUBLIC_ENDPOINT: '${SITE_URL:-https://e.avertxai.com}'
            OBJECT_STORAGE_ACCESS_KEY_ID: '${OBJECT_STORAGE_ACCESS_KEY_ID:-object_storage_root_user}'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: '${OBJECT_STORAGE_SECRET_ACCESS_KEY:-object_storage_root_password}'
            OTEL_EXPORTER_OTLP_ENDPOINT: ''
        volumes:
            - ./share:/share
        labels:
            # Caddy: /public/webhooks*, /public/m/* -> plugins:6738
            - 'traefik.enable=true'
            - 'traefik.http.routers.posthog-webhooks.rule=Host(`${DOMAIN:-e.avertxai.com}`) && (PathPrefix(`/public/webhooks`) || PathPrefix(`/public/m/`))'
            - 'traefik.http.routers.posthog-webhooks.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}'
            - 'traefik.http.routers.posthog-webhooks.tls=true'
            - 'traefik.http.routers.posthog-webhooks.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}'
            - 'traefik.http.routers.posthog-webhooks.priority=100'
            - 'traefik.http.services.posthog-webhooks.loadbalancer.server.port=6738'
        depends_on:
            - db
            - redis7
            - clickhouse
            - kafka
            - objectstorage
            - seaweedfs

    ingestion-general:
        image: ${POSTHOG_REGISTRY:-posthog/posthog}-node:${POSTHOG_NODE_TAG:-latest}
        command: node nodejs/dist/index.js
        restart: on-failure
        logging: *default-logging
        environment:
            PLUGIN_SERVER_MODE: 'ingestion-v2-combined'
            DATABASE_URL: 'postgres://${POSTGRES_USER:-posthog}:${POSTGRES_PASSWORD:-posthog}@db:5432/${POSTGRES_DB:-posthog}'
            PERSONS_DATABASE_URL: 'postgres://${POSTGRES_USER:-posthog}:${POSTGRES_PASSWORD:-posthog}@db:5432/${POSTGRES_DB:-posthog}'
            BEHAVIORAL_COHORTS_DATABASE_URL: 'postgres://${POSTGRES_USER:-posthog}:${POSTGRES_PASSWORD:-posthog}@db:5432/${POSTGRES_DB:-posthog}'
            KAFKA_HOSTS: 'kafka:9092'
            REDIS_URL: 'redis://redis7:6379/'
            CLICKHOUSE_HOST: 'clickhouse'
            CLICKHOUSE_DATABASE: 'posthog'
            CLICKHOUSE_SECURE: 'false'
            CLICKHOUSE_VERIFY: 'false'
            COOKIELESS_REDIS_HOST: redis7
            COOKIELESS_REDIS_PORT: 6379
            CDP_REDIS_HOST: redis7
            ENCRYPTION_SALT_KEYS: '${POSTHOG_ENCRYPTION_SALT_KEYS:?POSTHOG_ENCRYPTION_SALT_KEYS is required}'
        depends_on:
            - db
            - redis7
            - clickhouse
            - kafka

    ingestion-sessionreplay:
        image: ${POSTHOG_REGISTRY:-posthog/posthog}-node:${POSTHOG_NODE_TAG:-latest}
        command: node nodejs/dist/index.js
        restart: on-failure
        logging: *default-logging
        environment:
            PLUGIN_SERVER_MODE: 'recordings-blob-ingestion-v2'
            DATABASE_URL: 'postgres://${POSTGRES_USER:-posthog}:${POSTGRES_PASSWORD:-posthog}@db:5432/${POSTGRES_DB:-posthog}'
            KAFKA_HOSTS: 'kafka:9092'
            REDIS_URL: 'redis://redis7:6379/'
            SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: '${SESSION_RECORDING_S3_ACCESS_KEY_ID:-any}'
            SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: '${SESSION_RECORDING_S3_SECRET_ACCESS_KEY:-any}'
            SESSION_RECORDING_V2_S3_TIMEOUT_MS: 120000
            SESSION_RECORDING_V2_S3_ENDPOINT: 'http://seaweedfs:8333'
            ENCRYPTION_SALT_KEYS: '${POSTHOG_ENCRYPTION_SALT_KEYS:?POSTHOG_ENCRYPTION_SALT_KEYS is required}'
        depends_on:
            - db
            - redis7
            - kafka
            - seaweedfs

    recording-api:
        image: ${POSTHOG_REGISTRY:-posthog/posthog}-node:${POSTHOG_NODE_TAG:-latest}
        command: node nodejs/dist/index.js
        restart: on-failure
        logging: *default-logging
        environment:
            PLUGIN_SERVER_MODE: 'recording-api'
            DATABASE_URL: 'postgres://${POSTGRES_USER:-posthog}:${POSTGRES_PASSWORD:-posthog}@db:5432/${POSTGRES_DB:-posthog}'
            REDIS_URL: 'redis://redis7:6379/'
            CLICKHOUSE_HOST: 'clickhouse'
            CLICKHOUSE_DATABASE: 'posthog'
            CLICKHOUSE_SECURE: 'false'
            CLICKHOUSE_VERIFY: 'false'
            SESSION_RECORDING_API_REDIS_HOST: redis7
            SESSION_RECORDING_API_REDIS_PORT: 6379
            ENCRYPTION_SALT_KEYS: '${POSTHOG_ENCRYPTION_SALT_KEYS:?POSTHOG_ENCRYPTION_SALT_KEYS is required}'
        depends_on:
            - db
            - redis7
            - clickhouse

    ingestion-error-tracking:
        image: ${POSTHOG_REGISTRY:-posthog/posthog}-node:${POSTHOG_NODE_TAG:-latest}
        command: node nodejs/dist/index.js
        restart: on-failure
        logging: *default-logging
        environment:
            PLUGIN_SERVER_MODE: 'ingestion-errortracking'
            DATABASE_URL: 'postgres://${POSTGRES_USER:-posthog}:${POSTGRES_PASSWORD:-posthog}@db:5432/${POSTGRES_DB:-posthog}'
            KAFKA_HOSTS: 'kafka:9092'
            REDIS_URL: 'redis://redis7:6379/'
            CDP_REDIS_HOST: redis7
            ENCRYPTION_SALT_KEYS: '${POSTHOG_ENCRYPTION_SALT_KEYS:?POSTHOG_ENCRYPTION_SALT_KEYS is required}'
        depends_on:
            - db
            - redis7
            - kafka

    ingestion-logs:
        image: ${POSTHOG_REGISTRY:-posthog/posthog}-node:${POSTHOG_NODE_TAG:-latest}
        command: node nodejs/dist/index.js
        restart: on-failure
        logging: *default-logging
        environment:
            PLUGIN_SERVER_MODE: 'ingestion-logs'
            DATABASE_URL: 'postgres://${POSTGRES_USER:-posthog}:${POSTGRES_PASSWORD:-posthog}@db:5432/${POSTGRES_DB:-posthog}'
            KAFKA_HOSTS: 'kafka:9092'
            REDIS_URL: 'redis://redis7:6379/'
            LOGS_REDIS_HOST: redis7
        depends_on:
            - db
            - redis7
            - kafka

    ingestion-traces:
        image: ${POSTHOG_REGISTRY:-posthog/posthog}-node:${POSTHOG_NODE_TAG:-latest}
        command: node nodejs/dist/index.js
        restart: on-failure
        logging: *default-logging
        environment:
            PLUGIN_SERVER_MODE: 'ingestion-traces'
            DATABASE_URL: 'postgres://${POSTGRES_USER:-posthog}:${POSTGRES_PASSWORD:-posthog}@db:5432/${POSTGRES_DB:-posthog}'
            KAFKA_HOSTS: 'kafka:9092'
            REDIS_URL: 'redis://redis7:6379/'
            TRACES_REDIS_HOST: redis7
        depends_on:
            - db
            - redis7
            - kafka

    # -------------------------------------------------------------------------
    # Rust services — images: ghcr.io/posthog/posthog/<bin>
    # -------------------------------------------------------------------------
    capture:
        image: ghcr.io/posthog/posthog/capture:${POSTHOG_RUST_TAG:-master}
        restart: on-failure
        logging: *default-logging
        environment:
            ADDRESS: '0.0.0.0:3000'
            KAFKA_TOPIC: 'events_plugin_ingestion'
            KAFKA_HOSTS: 'kafka:9092'
            REDIS_URL: 'redis://redis7:6379/'
            CAPTURE_MODE: events
            RUST_LOG: 'info,rdkafka=warn'
        labels:
            # Caddy: /e*, /i/v0*, /batch*, /capture* -> capture:3000
            - 'traefik.enable=true'
            - 'traefik.http.routers.posthog-capture.rule=Host(`${DOMAIN:-e.avertxai.com}`) && (Path(`/e`) || PathPrefix(`/e/`) || Path(`/i/v0`) || PathPrefix(`/i/v0/`) || Path(`/batch`) || PathPrefix(`/batch/`) || Path(`/capture`) || PathPrefix(`/capture/`))'
            - 'traefik.http.routers.posthog-capture.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}'
            - 'traefik.http.routers.posthog-capture.tls=true'
            - 'traefik.http.routers.posthog-capture.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}'
            - 'traefik.http.routers.posthog-capture.priority=100'
            - 'traefik.http.services.posthog-capture.loadbalancer.server.port=3000'
        depends_on:
            - kafka
            - redis7

    replay-capture:
        image: ghcr.io/posthog/posthog/capture:${POSTHOG_RUST_TAG:-master}
        restart: on-failure
        logging: *default-logging
        environment:
            ADDRESS: '0.0.0.0:3000'
            KAFKA_TOPIC: 'session_recording_snapshot_item_events'
            KAFKA_HOSTS: 'kafka:9092'
            REDIS_URL: 'redis://redis7:6379/'
            CAPTURE_MODE: recordings
        labels:
            # Caddy: /s* -> replay-capture:3000
            - 'traefik.enable=true'
            - 'traefik.http.routers.posthog-replay.rule=Host(`${DOMAIN:-e.avertxai.com}`) && (Path(`/s`) || PathPrefix(`/s/`))'
            - 'traefik.http.routers.posthog-replay.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}'
            - 'traefik.http.routers.posthog-replay.tls=true'
            - 'traefik.http.routers.posthog-replay.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}'
            - 'traefik.http.routers.posthog-replay.priority=100'
            - 'traefik.http.services.posthog-replay.loadbalancer.server.port=3000'
        depends_on:
            - kafka
            - redis7

    property-defs-rs:
        image: ghcr.io/posthog/posthog/property-defs-rs:${POSTHOG_RUST_TAG:-master}
        restart: on-failure
        logging: *default-logging
        environment:
            DATABASE_URL: 'postgres://${POSTGRES_USER:-posthog}:${POSTGRES_PASSWORD:-posthog}@db:5432/${POSTGRES_DB:-posthog}'
            KAFKA_HOSTS: 'kafka:9092'
            SKIP_WRITES: 'false'
            SKIP_READS: 'false'
            FILTER_MODE: 'opt-out'
        depends_on:
            kafka-init:
                condition: service_completed_successfully
            db:
                condition: service_healthy

    feature-flags:
        image: ghcr.io/posthog/posthog/feature-flags:${POSTHOG_RUST_TAG:-master}
        restart: on-failure
        logging: *default-logging
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:3001/_readiness']
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s
        volumes:
            - ./share:/share
        environment:
            WRITE_DATABASE_URL: 'postgres://${POSTGRES_USER:-posthog}:${POSTGRES_PASSWORD:-posthog}@db:5432/${POSTGRES_DB:-posthog}'
            READ_DATABASE_URL: 'postgres://${POSTGRES_USER:-posthog}:${POSTGRES_PASSWORD:-posthog}@db:5432/${POSTGRES_DB:-posthog}'
            PERSONS_WRITE_DATABASE_URL: 'postgres://${POSTGRES_USER:-posthog}:${POSTGRES_PASSWORD:-posthog}@db:5432/${POSTGRES_DB:-posthog}'
            PERSONS_READ_DATABASE_URL: 'postgres://${POSTGRES_USER:-posthog}:${POSTGRES_PASSWORD:-posthog}@db:5432/${POSTGRES_DB:-posthog}'
            MAXMIND_DB_PATH: '/share/GeoLite2-City.mmdb'
            REDIS_URL: 'redis://redis7:6379/'
            ADDRESS: '0.0.0.0:3001'
            RUST_LOG: 'info'
            COOKIELESS_REDIS_HOST: redis7
            COOKIELESS_REDIS_PORT: 6379
        labels:
            # Caddy: /flags* -> feature-flags:3001
            - 'traefik.enable=true'
            - 'traefik.http.routers.posthog-flags.rule=Host(`${DOMAIN:-e.avertxai.com}`) && (Path(`/flags`) || PathPrefix(`/flags/`))'
            - 'traefik.http.routers.posthog-flags.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}'
            - 'traefik.http.routers.posthog-flags.tls=true'
            - 'traefik.http.routers.posthog-flags.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}'
            - 'traefik.http.routers.posthog-flags.priority=100'
            - 'traefik.http.services.posthog-flags.loadbalancer.server.port=3001'
        depends_on:
            - db
            - redis7

    hypercache-server:
        image: ghcr.io/posthog/posthog/hypercache-server:${POSTHOG_RUST_TAG:-master}
        restart: on-failure
        logging: *default-logging
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:3002/_readiness']
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s
        environment:
            REDIS_URL: 'redis://redis7:6379/'
            ADDRESS: '0.0.0.0:3002'
            RUST_LOG: 'info'
        labels:
            # Caddy: /surveys, /api/surveys (surveys) and /array/* (remote-config) -> hypercache-server:3002
            - 'traefik.enable=true'
            - 'traefik.http.routers.posthog-hypercache.rule=Host(`${DOMAIN:-e.avertxai.com}`) && (Path(`/surveys`) || PathPrefix(`/surveys/`) || Path(`/api/surveys`) || PathPrefix(`/api/surveys/`) || PathPrefix(`/array/`))'
            - 'traefik.http.routers.posthog-hypercache.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}'
            - 'traefik.http.routers.posthog-hypercache.tls=true'
            - 'traefik.http.routers.posthog-hypercache.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}'
            - 'traefik.http.routers.posthog-hypercache.priority=100'
            - 'traefik.http.services.posthog-hypercache.loadbalancer.server.port=3002'
        depends_on:
            - redis7

    cyclotron-janitor:
        image: ghcr.io/posthog/posthog/cyclotron-janitor:${POSTHOG_RUST_TAG:-master}
        restart: on-failure
        logging: *default-logging
        environment:
            DATABASE_URL: 'postgres://${POSTGRES_USER:-posthog}:${POSTGRES_PASSWORD:-posthog}@db:5432/${POSTGRES_DB:-posthog}'
            KAFKA_HOSTS: 'kafka:9092'
            KAFKA_TOPIC: 'clickhouse_app_metrics2'
        depends_on:
            db:
                condition: service_healthy
            kafka:
                condition: service_started

    personhog-replica:
        image: ghcr.io/posthog/posthog/personhog-replica:${POSTHOG_RUST_TAG:-master}
        restart: on-failure
        logging: *default-logging
        environment:
            GRPC_ADDRESS: '0.0.0.0:50051'
            PRIMARY_DATABASE_URL: 'postgres://${POSTGRES_USER:-posthog}:${POSTGRES_PASSWORD:-posthog}@db:5432/${POSTGRES_DB:-posthog}'
            RUST_LOG: 'info'
            METRICS_PORT: '9100'
        depends_on:
            db:
                condition: service_healthy

    personhog-router:
        image: ghcr.io/posthog/posthog/personhog-router:${POSTHOG_RUST_TAG:-master}
        restart: on-failure
        logging: *default-logging
        environment:
            GRPC_ADDRESS: '0.0.0.0:50052'
            REPLICA_URL: 'http://personhog-replica:50051'
            BACKEND_TIMEOUT_MS: '5000'
            RUST_LOG: 'info'
            METRICS_PORT: '9101'
        depends_on:
            - personhog-replica

    livestream:
        image: ghcr.io/posthog/posthog/livestream:${POSTHOG_RUST_TAG:-master}
        restart: on-failure
        logging: *default-logging
        environment:
            - LIVESTREAM_JWT_SECRET=${POSTHOG_SECRET_KEY:?POSTHOG_SECRET_KEY is required}
        volumes:
            - ./docker/livestream/configs-hobby.yml:/configs/configs.yml
        labels:
            # Caddy: /livestream* -> strip /livestream -> livestream:8080
            - 'traefik.enable=true'
            - 'traefik.http.routers.posthog-livestream.rule=Host(`${DOMAIN:-e.avertxai.com}`) && (Path(`/livestream`) || PathPrefix(`/livestream/`))'
            - 'traefik.http.routers.posthog-livestream.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}'
            - 'traefik.http.routers.posthog-livestream.tls=true'
            - 'traefik.http.routers.posthog-livestream.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}'
            - 'traefik.http.routers.posthog-livestream.priority=100'
            - 'traefik.http.routers.posthog-livestream.middlewares=posthog-livestream-strip'
            - 'traefik.http.middlewares.posthog-livestream-strip.stripprefix.prefixes=/livestream'
            - 'traefik.http.services.posthog-livestream.loadbalancer.server.port=8080'
        depends_on:
            kafka:
                condition: service_started

    cymbal:
        image: ghcr.io/posthog/posthog/cymbal:${POSTHOG_RUST_TAG:-master}
        restart: on-failure
        logging: *default-logging
        volumes:
            - ./share:/share
        environment:
            KAFKA_HOSTS: 'kafka:9092'
            OBJECT_STORAGE_BUCKET: posthog
            OBJECT_STORAGE_ACCESS_KEY_ID: '${SESSION_RECORDING_S3_ACCESS_KEY_ID:-any}'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: '${SESSION_RECORDING_S3_SECRET_ACCESS_KEY:-any}'
            OBJECT_STORAGE_ENDPOINT: 'http://seaweedfs:8333'
            OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
            BIND_HOST: '0.0.0.0'
            BIND_PORT: '3302'
            DATABASE_URL: 'postgres://${POSTGRES_USER:-posthog}:${POSTGRES_PASSWORD:-posthog}@db:5432/${POSTGRES_DB:-posthog}'
            PERSONS_URL: 'postgres://${POSTGRES_USER:-posthog}:${POSTGRES_PASSWORD:-posthog}@db:5432/${POSTGRES_DB:-posthog}'
            MAXMIND_DB_PATH: '/share/GeoLite2-City.mmdb'
            REDIS_URL: 'redis://redis7:6379/'
            ISSUE_BUCKETS_REDIS_URL: 'redis://redis7:6379/'
            RUST_LOG: 'info'
        depends_on:
            kafka-init:
                condition: service_completed_successfully
            seaweedfs:
                condition: service_healthy
            db:
                condition: service_healthy
            redis7:
                condition: service_healthy

    # -------------------------------------------------------------------------
    # Temporal (workflow engine)
    # -------------------------------------------------------------------------
    temporal:
        image: temporalio/auto-setup:1.26.2
        restart: on-failure
        logging: *default-logging
        healthcheck:
            test: ['CMD-SHELL', 'nc -z $(hostname) 7233']
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 300s
        environment:
            - DB=postgres12
            - DB_PORT=5432
            - POSTGRES_USER=${POSTGRES_USER:-posthog}
            - POSTGRES_PWD=${POSTGRES_PASSWORD:-posthog}
            - POSTGRES_SEEDS=db
            - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
            - ENABLE_ES=false
            - ES_SEEDS=elasticsearch
            - ES_VERSION=v7
        volumes:
            - ./docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
        depends_on:
            db:
                condition: service_healthy
            elasticsearch:
                condition: service_healthy

    elasticsearch:
        image: elasticsearch:7.17.28
        restart: on-failure
        logging: *default-logging
        environment:
            - cluster.routing.allocation.disk.threshold_enabled=true
            - cluster.routing.allocation.disk.watermark.low=512mb
            - cluster.routing.allocation.disk.watermark.high=256mb
            - cluster.routing.allocation.disk.watermark.flood_stage=128mb
            - discovery.type=single-node
            - ES_JAVA_OPTS=-Xms256m -Xmx256m
            - xpack.security.enabled=false
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'curl -s http://localhost:9200/_cluster/health | grep -qE "\"status\":\"(green|yellow)\""',
                ]
            interval: 10s
            timeout: 10s
            retries: 30
            start_period: 60s
        expose:
            - 9200
        volumes:
            - elasticsearch-data:/var/lib/elasticsearch/data

    temporal-admin-tools:
        image: temporalio/admin-tools:1.26.2
        logging: *default-logging
        environment:
            - TEMPORAL_CLI_ADDRESS=temporal:7233
        stdin_open: true
        tty: true
        depends_on:
            - temporal

    temporal-ui:
        image: temporalio/ui:2.47.2
        restart: on-failure
        logging: *default-logging
        environment:
            - TEMPORAL_ADDRESS=temporal:7233
            - TEMPORAL_CORS_ORIGINS=${SITE_URL:-https://e.avertxai.com}
            - TEMPORAL_CSRF_COOKIE_INSECURE=true
            - TEMPORAL_CODEC_ENDPOINT=${SITE_URL:-https://e.avertxai.com}
        depends_on:
            temporal:
                condition: service_started
            db:
                condition: service_healthy

volumes:
    postgres-data:
    redis7-data:
    clickhouse-data:
    zookeeper-data:
    zookeeper-datalog:
    zookeeper-logs:
    redpanda-data:
    objectstorage:
    seaweedfs:
    elasticsearch-data:
